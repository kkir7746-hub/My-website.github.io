<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Пример</title>

<style>
body { font-family: Arial; }
button { padding: 10px; }
</style>

</head>
<body>

<h1>Мой сайт</h1>

<p id="info">Здесь будет текст</p>

<button onclick="addText()">Добавить текст</button>

<script>
function addText() {
    document.getElementById("info").innerText = "Ты разобрался в основах!";
}
</script>

</body>
</html>
